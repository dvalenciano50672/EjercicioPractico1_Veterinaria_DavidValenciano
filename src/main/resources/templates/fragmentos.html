<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <header th:fragment="header" class="bg-success text-white text-center p-4">
        <h1 th:text="#{header.titulo}">Clinica Veterinaria</h1>
        <p th:text="#{header.subtitulo}">Cuidamos de tus mascotas</p>
    </header>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-light">
        <div class="container">
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}"
                   th:text="#{nav.inicio}">Inicio</a>

                <a class="nav-link" th:href="@{/tipos}"
                   th:text="#{nav.tipos}">Tipos</a>

                <a class="nav-link" th:href="@{/servicios}"
                   th:text="#{nav.servicios}">Servicios</a>

                <a class="nav-link" th:href="@{/citas}"
                   th:text="#{nav.citas}">Citas</a>

                <a class="nav-link" th:href="@{/consultas}"
                   th:text="#{nav.consultas}">Consultas</a>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0" th:text="#{footer.texto}">
            Clinica Veterinaria
        </p>
    </footer>

</body>
</html>
